<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nescafé Clásico</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a0a00; --surface: #2a1200; --surface2: #3a1a00;
      --text: #fff8f0; --muted: rgba(255,248,240,0.5);
      --accent: #e8321a; --accent2: #f5a623;
      --radius: 16px;
    }
    html, body {
      min-height: 100%; width: 100%; background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif;
    }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 0 4rem; }

    /* Hero */
    .hero {
      width: 100%; background: linear-gradient(160deg, #c8240a 0%, #8b1500 100%);
      padding: 3rem 2rem 2.5rem; text-align: center; position: relative; overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(circle at 70% 30%, rgba(245,166,35,0.25) 0%, transparent 60%);
    }
    .hero-badge {
      display: inline-block; font-size: 10px; letter-spacing: 0.15em; font-weight: 600;
      text-transform: uppercase; color: var(--accent2); background: rgba(245,166,35,0.15);
      border: 1px solid rgba(245,166,35,0.35); border-radius: 999px;
      padding: 4px 12px; margin-bottom: 1rem; position: relative;
    }
    .hero-icon { font-size: 52px; margin-bottom: 0.5rem; position: relative; }
    .hero h1 {
      font-family: 'DM Serif Display', serif; font-size: clamp(2rem, 7vw, 2.8rem);
      line-height: 1.1; color: white; position: relative;
    }
    .hero h1 span { color: var(--accent2); }
    .hero-sub { font-size: 14px; color: rgba(255,255,255,0.65); margin-top: 0.5rem; position: relative; }

    /* Content */
    .content { width: 100%; max-width: 480px; padding: 0 1.25rem; }

    /* Play button */
    .play-section { text-align: center; padding: 2rem 0 1.5rem; }
    .play-btn {
      position: relative; width: 140px; height: 140px; border-radius: 50%;
      border: none; background: var(--accent); color: white; cursor: pointer;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 6px; margin: 0 auto 1rem;
      transition: transform 0.15s, opacity 0.2s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 8px 30px rgba(232,50,26,0.45);
    }
    .play-btn:active { transform: scale(0.93); }
    .play-btn .icon { font-size: 36px; }
    .play-btn .lbl { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
    .play-btn::before, .play-btn::after {
      content: ''; position: absolute; border-radius: 50%;
      border: 2px solid var(--accent); opacity: 0; animation: pulse 2.5s ease-out infinite;
    }
    .play-btn::after { animation-delay: 1.2s; }
    @keyframes pulse {
      0%   { width: 140px; height: 140px; opacity: 0.5; }
      100% { width: 220px; height: 220px; opacity: 0; }
    }
    .play-btn.playing { background: var(--surface2); border: 2px solid var(--accent); }
    .play-btn.playing::before, .play-btn.playing::after { display: none; }
    .wave { display: none; align-items: flex-end; gap: 4px; height: 26px; }
    .play-btn.playing .wave { display: flex; }
    .play-btn.playing .icon { display: none; }
    .wave span {
      display: block; width: 4px; background: var(--accent); border-radius: 2px;
      animation: bar 0.8s ease-in-out infinite alternate;
    }
    .wave span:nth-child(1) { height: 7px;  animation-delay: 0s; }
    .wave span:nth-child(2) { height: 18px; animation-delay: 0.15s; }
    .wave span:nth-child(3) { height: 26px; animation-delay: 0.3s; }
    .wave span:nth-child(4) { height: 14px; animation-delay: 0.45s; }
    .wave span:nth-child(5) { height: 9px;  animation-delay: 0.6s; }
    @keyframes bar { from { transform: scaleY(0.3); } to { transform: scaleY(1); } }
    .play-status { font-size: 13px; color: var(--muted); min-height: 18px; }

    /* Cards */
    .cards { display: flex; flex-direction: column; gap: 12px; margin-top: 0.5rem; }
    .card {
      background: var(--surface); border-radius: var(--radius); padding: 1.25rem;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .card-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--accent2); margin-bottom: 0.75rem;
    }
    .card-body { font-size: 14px; color: var(--muted); line-height: 1.8; }
    .card-body strong { color: var(--text); font-weight: 500; }
    .card-body p { margin-bottom: 0.5rem; }
    .card-body p:last-child { margin-bottom: 0; }
    .nutrition-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
    .nut-item { background: var(--surface2); border-radius: 10px; padding: 10px 12px; }
    .nut-item .val { font-size: 18px; font-weight: 600; color: var(--text); }
    .nut-item .key { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .footer { margin-top: 2rem; text-align: center; font-size: 12px; color: var(--muted); }
    .nestle-logo { font-size: 11px; letter-spacing: 0.1em; color: rgba(255,255,255,0.2); margin-top: 4px; }
  </style>
</head>
<body>
<div class="page">
  <div class="hero">
    <div class="hero-badge">Nestlé — Información de producto</div>
    <div class="hero-icon">☕</div>
    <h1>Nescafé <span>Clásico</span></h1>
    <p class="hero-sub" id="hero-sub">Café soluble instantáneo</p>
  </div>

  <div class="content">
    <div class="play-section">
      <button class="play-btn" id="play-btn" onclick="handleTap()">
        <span class="icon">▶</span>
        <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
        <span class="lbl" id="play-lbl">Escuchar</span>
      </button>
      <p class="play-status" id="play-status"></p>
    </div>

    <div class="cards">
      <div class="card">
        <div class="card-title" id="lbl-desc">Descripción</div>
        <div class="card-body" id="txt-desc"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-ingr">Ingredientes</div>
        <div class="card-body" id="txt-ingr"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-allerg">Alérgenos</div>
        <div class="card-body" id="txt-allerg"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-nutr">Información nutricional</div>
        <div class="card-body">
          <p style="font-size:12px; color: var(--muted); margin-bottom: 10px;" id="txt-nutr-note"></p>
          <div class="nutrition-grid">
            <div class="nut-item"><div class="val">4 kcal</div><div class="key" id="lbl-cal"></div></div>
            <div class="nut-item"><div class="val">0.2 g</div><div class="key" id="lbl-fat"></div></div>
            <div class="nut-item"><div class="val">0.06 g</div><div class="key" id="lbl-carb"></div></div>
            <div class="nut-item"><div class="val">0.14 g</div><div class="key" id="lbl-prot"></div></div>
            <div class="nut-item"><div class="val">0.25 g</div><div class="key" id="lbl-salt"></div></div>
            <div class="nut-item"><div class="val">80 mg</div><div class="key" id="lbl-caff"></div></div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-prep">Modo de preparación</div>
        <div class="card-body" id="txt-prep"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-store">Conservación</div>
        <div class="card-body" id="txt-store"></div>
      </div>
      <div class="card">
        <div class="card-title" id="lbl-contact">Contacto</div>
        <div class="card-body" id="txt-contact"></div>
      </div>
    </div>

    <div class="footer">
      <div id="txt-footer"></div>
      <div class="nestle-logo">NESTLÉ — Good food, Good life</div>
    </div>
  </div>
</div>

      },

  const langFallback = { ca:"es", gl:"es", eu:"es", de:"fr", it:"fr", nl:"fr", ro:"fr" };

  let currentLang = "es";
  let isPlaying = false;

  function detectLang() {
    const nav = (navigator.language || "es").toLowerCase().split("-")[0];
    if (i18n[nav]) return nav;
    if (langFallback[nav]) return langFallback[nav];
    return "es";
  }

  function applyLang() {
    const t = i18n[currentLang];
    const l = t.lbl;
    const tx = t.txt;
    document.getElementById("hero-sub").textContent = t.heroSub;
    document.getElementById("play-lbl").textContent = t.playLbl;
    document.getElementById("lbl-desc").textContent = l.desc;
    document.getElementById("lbl-ingr").textContent = l.ingr;
    document.getElementById("lbl-allerg").textContent = l.allerg;
    document.getElementById("lbl-nutr").textContent = l.nutr;
    document.getElementById("txt-nutr-note").textContent = l.nutrNote;
    document.getElementById("lbl-cal").textContent = l.cal;
    document.getElementById("lbl-fat").textContent = l.fat;
    document.getElementById("lbl-carb").textContent = l.carb;
    document.getElementById("lbl-prot").textContent = l.prot;
    document.getElementById("lbl-salt").textContent = l.salt;
    document.getElementById("lbl-caff").textContent = l.caff;
    document.getElementById("lbl-prep").textContent = l.prep;
    document.getElementById("lbl-store").textContent = l.store;
    document.getElementById("lbl-contact").textContent = l.contact;
    document.getElementById("txt-footer").textContent = l.footer;
    document.getElementById("txt-desc").innerHTML = tx.desc;
    document.getElementById("txt-ingr").innerHTML = tx.ingr;
    document.getElementById("txt-allerg").innerHTML = tx.allerg;
    document.getElementById("txt-prep").innerHTML = tx.prep;
    document.getElementById("txt-store").innerHTML = tx.store;
    document.getElementById("txt-contact").innerHTML = tx.contact;
  }

  function stopAudio() {
    window.speechSynthesis.cancel();
    isPlaying = false;
    document.getElementById("play-btn").classList.remove("playing");
    document.getElementById("play-status").textContent = "";
    document.getElementById("play-lbl").textContent = i18n[currentLang].playLbl;
  }

  function handleTap() {
    if (isPlaying) { stopAudio(); return; }
    if (!('speechSynthesis' in window)) {
      document.getElementById("play-status").textContent = "Audio no disponible en este navegador.";
      return;
    }
    const t = i18n[currentLang];
    const utter = new SpeechSynthesisUtterance(t.audio);
    utter.lang = t.lang;
    utter.rate = 0.93;
    utter.onstart = () => {
      isPlaying = true;
      document.getElementById("play-btn").classList.add("playing");
      document.getElementById("play-lbl").textContent = t.stopLbl;
      document.getElementById("play-status").textContent = t.playing;
    };
    utter.onend = utter.onerror = () => stopAudio();
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(utter);
  }

  currentLang = detectLang();
  applyLang();
</script>
</body>
