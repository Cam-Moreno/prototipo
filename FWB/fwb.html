<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buen Sabor</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><a class="brand" href="index.html">Buen <span>Sabor.</span></a></header>
<main>
<div class="hero"><h1 data-i18n="heroT"></h1><p data-i18n="heroS"></p></div>
<div class="toolbar"><input id="search" type="search" data-ph="search" data-aria="search" oninput="renderMenu()"><span class="small" id="productCount"></span></div>
<div id="categories" class="categories"></div>
<div class="layout">
<div id="productGrid" class="grid"></div>
<aside class="panel"><h2><span data-i18n="yourOrder"></span> <span class="small" id="cartCount"></span></h2><div id="cartContents"></div><div class="total"><span data-i18n="total"></span><span id="cartTotal">$0</span></div>
<label class="small" for="tableNumber" data-i18n="table"></label><input id="tableNumber" data-ph="tablePh" style="margin:7px 0 10px">
<label class="small" for="orderNote" data-i18n="note"></label><textarea id="orderNote" rows="2" data-ph="notePh" style="margin:7px 0 12px"></textarea>
<button style="width:100%" onclick="placeOrder()" data-i18n="send"></button></aside>
</div>
</main>
<footer>Buen Sabor</footer>
<dialog id="done"><h2 id="doneTitle"></h2><p id="doneText"></p><button style="width:100%" onclick="$('done').close()" data-i18n="ok"></button></dialog>
<script src="app.js"></script>
<script>
let cart={},activeCategory='Todos';
function renderCategories(){const cats=['Todos',...new Set(products.map(p=>p.category))];$('categories').innerHTML=cats.map(c=>`<button class="${activeCategory===c?'active':''}" onclick="setCategory(${esc(JSON.stringify(c))})">${esc(catLabel(c))}</button>`).join('')}
function setCategory(c){activeCategory=c;renderMenu()}
function renderMenu(){renderCategories();const q=$('search').value.toLowerCase();const list=products.filter(p=>(activeCategory==='Todos'||p.category===activeCategory)&&(pName(p)+' '+(pDesc(p)||'')).toLowerCase().includes(q));$('productCount').textContent=t('nItems',{n:list.length});$('productGrid').innerHTML=list.length?list.map(p=>`<article class="product"><div class="food-art">${esc(p.emoji||'🍽️')}</div><div class="product-body"><span class="eyebrow">${esc(catLabel(p.category))}</span><h3>${esc(pName(p))}</h3><p>${esc(pDesc(p)||t('defDesc'))}</p><div class="product-bottom"><span class="price">${money(p.price)}</span><button onclick="addToCart(${p.id})">${t('add')}</button></div></div></article>`).join(''):`<div class="empty" style="grid-column:1/-1">${t('noRes')}</div>`;renderCart()}
function addToCart(id){cart[id]=(cart[id]||0)+1;renderCart()}
function changeQty(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0)delete cart[id];renderCart()}
function cartItems(){return Object.entries(cart).map(([id,q])=>({p:products.find(p=>p.id===Number(id)),q})).filter(x=>x.p)}
function renderCart(){const items=cartItems(),count=items.reduce((s,x)=>s+x.q,0),total=items.reduce((s,x)=>s+x.p.price*x.q,0);$('cartCount').textContent=count?`(${count})`:'';$('cartTotal').textContent=money(total);$('cartContents').innerHTML=items.length?items.map(({p,q})=>`<div class="cart-row"><div><strong>${esc(pName(p))}</strong><div class="small">${money(p.price)} ${t('each')}</div><div style="display:flex;gap:8px;align-items:center;margin-top:5px"><button class="secondary" style="padding:3px 9px" aria-label="${t('less')}" onclick="changeQty(${p.id},-1)">−</button><span>${q}</span><button class="secondary" style="padding:3px 9px" aria-label="${t('more')}" onclick="changeQty(${p.id},1)">+</button></div></div><strong>${money(p.price*q)}</strong></div>`).join(''):`<p class="small">${t('empty')}</p>`}
function placeOrder(){const items=cartItems();if(!items.length){$('doneTitle').textContent=t('emptyT');$('doneText').textContent=t('emptyD');$('done').showModal();return}
orders=load('orders',[]);const order={id:Date.now(),number:orders.length+1,table:$('tableNumber').value.trim(),note:$('orderNote').value.trim(),items:items.map(x=>({name:pName(x.p),price:x.p.price,quantity:x.q})),total:items.reduce((s,x)=>s+x.p.price*x.q,0),status:'Pendiente'};orders.unshift(order);persist();cart={};$('orderNote').value='';renderMenu();$('doneTitle').textContent=t('sentT',{n:order.number});$('doneText').textContent=t('sentD',{v:money(order.total)});$('done').showModal()}
applyI18n();document.title=t('menu')+' · Buen Sabor';renderMenu();
</script>
</body></html>
